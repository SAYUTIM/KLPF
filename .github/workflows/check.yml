# プッシュとプルリクエストで、Node環境を用意してJavaScriptのLint検査を実行する。
# 実サイトの認証やKu-Portへのアクセスは行わず、リポジトリの読み取り権限だけを使う。
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
